{% extends 'users/base.html' %}
{% load my_tags %}
{% block title %}Удаление сотрудника{% endblock %}
{% block content %}
<div class="container">
    <div class="container mt-3">
        <h1 class="mb-4">Удаление сотрудника</h1>
        <p>Вы уверены, что хотите удалить сотрудника "{{user}}"?</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Удалить</button>
            <a class="btn btn-secondary" href="{% url 'users:user_detail' user.pk %}">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
