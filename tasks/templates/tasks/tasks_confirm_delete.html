{% extends 'home_page/base.html' %}
{% block title %}Удаление задачи{% endblock %}
{% block content %}
<div class="container">
    <div class="container mt-3">
        <h1 class="mb-4">Удаление задачи</h1>
        <p>Вы уверены, что хотите удалить задачу "{{task}}"?</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Удалить</button>
            <a class="btn btn-secondary" href="{% url 'tasks:task_detail' task.pk %}">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
