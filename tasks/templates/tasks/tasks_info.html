{% extends 'users/base.html' %}
{% load my_tags %}
{% block title %}Информация о задачах{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="modal modal-sheet position-static d-block" tabindex="-1" role="dialog" id="modalSign">
            <div class="modal-dialog" role="document">
                <div class="modal-content rounded-4 shadow">
                    <div class="modal-header p-4 pb-4 border-bottom-0 d-flex justify-content-center">
                        <div class="card-body">
                            <h4 class="my-0 font-weight-normal mt-3 text-center">Информация о задаче:</h4>
                            <hr class="my-4">
                            <h4 class="my-0 font-weight-normal mt-3">Название:</h4>
                            <section class="text-center container">
                                <a href="{% url 'users:home' %}" class="btn btn-secondary my-2">Подробнее</a>
                            </section>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<section class="text-center container">
    <a href="{% url 'users:home' %}" class="btn btn-secondary my-2">На главную</a>
</section>

{% endblock %}
