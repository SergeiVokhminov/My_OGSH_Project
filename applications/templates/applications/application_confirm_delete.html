{% extends 'users/base.html' %}
{% load my_tags %}
{% block title %}Удаление заявки{% endblock %}
{% block content %}
<div class="container">
    <div class="container mt-3">
        <h1 class="mb-4">Удаление заявки</h1>
        <p>Вы уверены, что хотите удалить заявку "{{task}}"?</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Удалить</button>
            <a class="btn btn-secondary" href="#">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
